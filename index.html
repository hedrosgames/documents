<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hedros Games — Documentação</title>
  <meta name="description" content="Documentação de jogos da Hedros Games.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ef4444'/%3E%3Ccircle cx='16' cy='16' r='12' fill='%23f97316'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23eab308'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%2322c55e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%233b82f6'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%238b5cf6'/%3E%3C/svg%3E" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #141a22;
      --panel2: #1b232d;
      --text: #e8eef6;
      --muted: #97a4b4;
      --border: #26313d;
      --accent: #3ecf8e;
    }
    * { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      background-color: var(--bg);
      color-scheme: dark;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      background-color: var(--bg);
      background-image: radial-gradient(circle at top right, #7c3aed14, transparent 45%);
      background-repeat: no-repeat;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      display: flex;
      align-items: center;
      min-height: 100dvh;
      padding: clamp(1.5rem, 5vw, 3rem) clamp(1rem, 4vw, 1.5rem);
    }
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 320px));
      gap: 1.25rem;
      justify-content: center;
      width: 100%;
      margin: 0 auto;
    }
    .game-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-align: center;
    }
    .game-title {
      margin: 0;
      font-size: clamp(1.05rem, 3vw, 1.3rem);
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .game-art {
      position: relative;
      display: block;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      text-decoration: none;
    }
    .game-art img { display: block; width: 100%; height: auto; }
    .game-open {
      position: absolute;
      inset-inline: 0;
      bottom: 0;
      padding: 0.5rem;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
    }
    a.game-art:hover { border-color: var(--accent); }
    .game-card.is-locked .game-art { opacity: 0.5; filter: grayscale(0.7); }
    .progress-status {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .progress-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }
    .progress-actions button {
      min-height: 2.25rem;
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel2);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .progress-actions button:hover:not(:disabled) { border-color: var(--accent); }
    .progress-actions button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
<main class="shell">
  <div class="game-grid">
    <section class="game-card">
      <h2 class="game-title">Pokémon</h2>
      <a class="game-art" href="Pokemon/pokemon-index.html">
        <img src="Pokemon/assets/pokemon-cover.png" alt="Capa do kit de referência Pokémon" decoding="async">
        <span class="game-open">Abrir guias →</span>
      </a>
      <p class="progress-status">Kit de referência de design para o Bestiary.</p>
    </section>

    <section class="game-card">
      <h2 class="game-title">Digimon World 3</h2>
      <a class="game-art" href="Digimon%20World%203/digimon-world-3-agumon-tree.html">
        <img src="Digimon%20World%203/assets/digimon-world-3-cover.jpg" width="632" height="630" alt="Capa de Digimon World 3 no PlayStation" decoding="async">
        <span class="game-open">Abrir guias →</span>
      </a>
      <p class="progress-status" id="progressStatus">Lendo…</p>
      <div class="progress-actions">
        <button type="button" id="exportProgress">Exportar</button>
        <button type="button" id="importProgress">Importar</button>
      </div>
    </section>

    <section class="game-card is-locked">
      <h2 class="game-title">Digimon World 2</h2>
      <div class="game-art">
        <img src="Digimon%20World%203/assets/digimon-world-2-cover.jpg" width="632" height="624" alt="Capa de Digimon World 2 no PlayStation" decoding="async">
      </div>
      <p class="progress-status">Guias ainda não disponíveis.</p>
      <div class="progress-actions">
        <button type="button" disabled>Em breve</button>
      </div>
    </section>
  </div>
</main>
<script>
(function () {
  const KEY_RE = /^dw3-/;
  const PROGRESS_URL = "Digimon%20World%203/dw3-progress.json";
  const statusEl = document.getElementById("progressStatus");

  function snapshot() {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (KEY_RE.test(k)) data[k] = localStorage.getItem(k);
    }
    return data;
  }

  function summarize(data) {
    const keys = Object.keys(data);
    if (!keys.length) return "Nada marcado neste domínio ainda.";
    const bits = [];
    if (data["dw3-booster-cards-owned-v1"]) {
      try { bits.push(JSON.parse(data["dw3-booster-cards-owned-v1"]).length + " cartas"); } catch (_) { bits.push("cartas"); }
    }
    if (data["dw3-steal-items-owned-v1"]) {
      try { bits.push(JSON.parse(data["dw3-steal-items-owned-v1"]).length + " itens"); } catch (_) { bits.push("itens"); }
    }
    const evoKeys = keys.filter(k => /-owned-v1$/.test(k) && k !== "dw3-booster-cards-owned-v1" && k !== "dw3-steal-items-owned-v1");
    if (evoKeys.length) {
      let n = 0;
      evoKeys.forEach(k => { try { n += JSON.parse(data[k]).length; } catch (_) {} });
      bits.push(n + " Digivolutions (" + evoKeys.length + " partners)");
    }
    return "Neste domínio: " + bits.join(" · ") + " — " + keys.length + " chave(s).";
  }

  function applyData(data) {
    let n = 0;
    Object.keys(data).forEach(k => {
      if (!KEY_RE.test(k)) return;
      localStorage.setItem(k, typeof data[k] === "string" ? data[k] : JSON.stringify(data[k]));
      n++;
    });
    return n;
  }

  function refresh() {
    statusEl.textContent = summarize(snapshot());
  }

  document.getElementById("exportProgress").addEventListener("click", () => {
    const data = snapshot();
    if (!Object.keys(data).length) {
      statusEl.textContent = "Não tem nada pra exportar neste domínio.";
      return;
    }
    const blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), data }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "dw3-progress.json";
    a.click();
    URL.revokeObjectURL(a.href);
    statusEl.textContent = "dw3-progress.json baixado.";
  });

  document.getElementById("importProgress").addEventListener("click", async () => {
    const hasLocal = Object.keys(snapshot()).length > 0;
    const msg = hasLocal
      ? "Isso sobrescreve o progresso salvo neste navegador com o JSON do repositório. Continuar?"
      : "Importar o progresso do repositório neste navegador?";
    if (!confirm(msg)) return;

    statusEl.textContent = "Buscando dw3-progress.json…";
    try {
      const res = await fetch(PROGRESS_URL + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("http " + res.status);
      const parsed = await res.json();
      const data = parsed.data && typeof parsed.data === "object" ? parsed.data : parsed;
      const n = applyData(data);
      if (!n) throw new Error("no keys");
      statusEl.textContent = "Importado: " + n + " chave(s). " + summarize(snapshot());
      refresh();
    } catch (_) {
      statusEl.textContent = "Não deu pra carregar o dw3-progress.json.";
    }
  });

  refresh();
})();
</script>
</body>
</html>

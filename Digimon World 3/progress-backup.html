<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="dw3-shell.css">
<title>DW3 — Backup de progresso</title>
</head>
<body>
<header class="site-header">
  <h1>Backup de progresso</h1>
  <p>Exporta o cache deste navegador ou importa o <code>dw3-progress.json</code> do repositório.</p>
  <nav class="doc-nav" aria-label="Guides">
    <a href="index.html">Hub</a>
  </nav>
</header>
<main class="shell-app">
  <section class="progress-box" aria-labelledby="progress-title">
    <h3 id="progress-title">Progresso neste domínio</h3>
    <p class="progress-status" id="progressStatus">Lendo…</p>
    <div class="progress-actions">
      <button type="button" id="exportProgress">Exportar</button>
      <button type="button" id="importProgress">Importar</button>
    </div>
    <pre id="progressKeys" style="margin:0.75rem 0 0;padding:0.65rem 0.75rem;background:var(--panel2);border-radius:8px;font-size:0.75rem;overflow:auto;max-height:12rem;color:var(--muted);text-align:left"></pre>
  </section>
</main>
<script>
(function () {
  const KEY_RE = /^dw3-/;
  const PROGRESS_URL = "dw3-progress.json";
  const statusEl = document.getElementById("progressStatus");
  const keysEl = document.getElementById("progressKeys");

  function snapshot() {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (KEY_RE.test(k)) data[k] = localStorage.getItem(k);
    }
    return data;
  }

  function applyData(data) {
    let n = 0;
    Object.keys(data).forEach(k => {
      if (!KEY_RE.test(k)) return;
      localStorage.setItem(k, typeof data[k] === "string" ? data[k] : JSON.stringify(data[k]));
      n++;
    });
    return n;
  }

  function refresh() {
    const data = snapshot();
    const keys = Object.keys(data).sort();
    if (!keys.length) {
      statusEl.textContent = "Nada marcado neste domínio.";
      keysEl.textContent = "";
      return;
    }
    statusEl.textContent = keys.length + " chave(s) dw3-* neste domínio.";
    keysEl.textContent = keys.map(k => {
      let n = "";
      try {
        const v = JSON.parse(data[k]);
        if (Array.isArray(v)) n = " → " + v.length + " itens";
      } catch (_) {}
      return k + n;
    }).join("\n");
  }

  document.getElementById("exportProgress").addEventListener("click", () => {
    const data = snapshot();
    if (!Object.keys(data).length) {
      statusEl.textContent = "Não tem nada pra exportar.";
      return;
    }
    const blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), data }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "dw3-progress.json";
    a.click();
    URL.revokeObjectURL(a.href);
    statusEl.textContent = "Baixado. Pra atualizar o Git, troca Digimon World 3/dw3-progress.json e faz commit.";
  });

  document.getElementById("importProgress").addEventListener("click", async () => {
    const hasLocal = Object.keys(snapshot()).length > 0;
    const msg = hasLocal
      ? "Isso sobrescreve o progresso salvo neste navegador com o JSON do repositório. Continuar?"
      : "Importar o progresso do repositório neste navegador?";
    if (!confirm(msg)) return;

    statusEl.textContent = "Buscando dw3-progress.json…";
    try {
      const res = await fetch(PROGRESS_URL + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("http " + res.status);
      const parsed = await res.json();
      const data = parsed.data && typeof parsed.data === "object" ? parsed.data : parsed;
      const n = applyData(data);
      if (!n) throw new Error("no keys");
      statusEl.textContent = "Importado do Git: " + n + " chave(s).";
      refresh();
    } catch (_) {
      statusEl.textContent = "Não deu pra importar. Confere se dw3-progress.json está no mesmo domínio.";
    }
  });

  refresh();
})();
</script>
</body>
</html>

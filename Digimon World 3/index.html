<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="dw3-shell.css">
<title>Digimon World 3 — Guias</title>
</head>
<body class="hub">
<main class="shell-app">
  <div class="game-grid">
    <section class="game-card">
      <h2 class="game-title">Digimon World 3</h2>
      <a class="game-art" href="digimon-world-3-agumon-tree.html">
        <img src="assets/digimon-world-3-cover.jpg" width="632" height="630" alt="Capa de Digimon World 3 no PlayStation" decoding="async">
        <span class="game-open">Abrir guias →</span>
      </a>
      <p class="progress-status" id="progressStatus">Lendo…</p>
      <div class="progress-actions">
        <button type="button" id="exportProgress">Exportar</button>
        <button type="button" id="importProgress">Importar</button>
      </div>
    </section>

    <section class="game-card is-locked">
      <h2 class="game-title">Digimon World 2</h2>
      <div class="game-art">
        <img src="assets/digimon-world-2-cover.jpg" width="632" height="624" alt="Capa de Digimon World 2 no PlayStation" decoding="async">
      </div>
      <p class="progress-status">Guias ainda não disponíveis.</p>
      <div class="progress-actions">
        <button type="button" disabled>Em breve</button>
      </div>
    </section>
  </div>
</main>
<script>
(function () {
  const KEY_RE = /^dw3-/;
  const PROGRESS_URL = "dw3-progress.json";
  const statusEl = document.getElementById("progressStatus");

  function snapshot() {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (KEY_RE.test(k)) data[k] = localStorage.getItem(k);
    }
    return data;
  }

  function summarize(data) {
    const keys = Object.keys(data);
    if (!keys.length) return "Nada marcado neste domínio ainda.";
    const bits = [];
    if (data["dw3-booster-cards-owned-v1"]) {
      try { bits.push(JSON.parse(data["dw3-booster-cards-owned-v1"]).length + " cartas"); } catch (_) { bits.push("cartas"); }
    }
    if (data["dw3-steal-items-owned-v1"]) {
      try { bits.push(JSON.parse(data["dw3-steal-items-owned-v1"]).length + " itens"); } catch (_) { bits.push("itens"); }
    }
    const evoKeys = keys.filter(k => /-owned-v1$/.test(k) && k !== "dw3-booster-cards-owned-v1" && k !== "dw3-steal-items-owned-v1");
    if (evoKeys.length) {
      let n = 0;
      evoKeys.forEach(k => { try { n += JSON.parse(data[k]).length; } catch (_) {} });
      bits.push(n + " Digivolutions (" + evoKeys.length + " partners)");
    }
    return "Neste domínio: " + bits.join(" · ") + " — " + keys.length + " chave(s).";
  }

  function applyData(data) {
    let n = 0;
    Object.keys(data).forEach(k => {
      if (!KEY_RE.test(k)) return;
      localStorage.setItem(k, typeof data[k] === "string" ? data[k] : JSON.stringify(data[k]));
      n++;
    });
    return n;
  }

  function refresh() {
    statusEl.textContent = summarize(snapshot());
  }

  document.getElementById("exportProgress").addEventListener("click", () => {
    const data = snapshot();
    if (!Object.keys(data).length) {
      statusEl.textContent = "Não tem nada pra exportar neste domínio.";
      return;
    }
    const blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), data }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "dw3-progress.json";
    a.click();
    URL.revokeObjectURL(a.href);
    statusEl.textContent = "dw3-progress.json baixado.";
  });

  document.getElementById("importProgress").addEventListener("click", async () => {
    const current = snapshot();
    const hasLocal = Object.keys(current).length > 0;
    const msg = hasLocal
      ? "Isso sobrescreve o progresso salvo neste navegador com o JSON do repositório. Continuar?"
      : "Importar o progresso do repositório neste navegador?";
    if (!confirm(msg)) return;

    statusEl.textContent = "Buscando dw3-progress.json…";
    try {
      const res = await fetch(PROGRESS_URL + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("http " + res.status);
      const parsed = await res.json();
      const data = parsed.data && typeof parsed.data === "object" ? parsed.data : parsed;
      const n = applyData(data);
      if (!n) throw new Error("no keys");
      statusEl.textContent = "Importado: " + n + " chave(s). " + summarize(snapshot());
      refresh();
    } catch (_) {
      statusEl.textContent = "Não deu pra carregar o dw3-progress.json.";
    }
  });

  refresh();
})();
</script>
</body>
</html>

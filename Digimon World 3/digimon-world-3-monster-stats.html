<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="dw3-shell.css">
<title>Digimon World 3 — Monster Stats</title>
<style>
:root {
  --bg: #0c1017;
  --panel: #151c27;
  --panel2: #1c2635;
  --text: #edf2f7;
  --muted: #8fa0b5;
  --asuka: #4db6ff;
  --amaterasu: #f0a020;
  --special: #b388ff;
  --border: #2a3648;
  --accent: #3ecf8e;
  --fire: #ff7043;
  --water: #42a5f5;
  --ice: #80deea;
  --wind: #aed581;
  --thunder: #ffd54f;
  --machine: #b0bec5;
  --dark: #ce93d8;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  -webkit-font-smoothing: antialiased;
  font-family: "Segoe UI", system-ui, sans-serif;
  background:
    radial-gradient(ellipse 70% 40% at 0% 0%, rgba(77,182,255,0.1), transparent),
    radial-gradient(ellipse 50% 35% at 100% 0%, rgba(240,160,32,0.08), transparent),
    var(--bg);
  color: var(--text); line-height: 1.45;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--accent) 70%, white);
  outline-offset: 2px;
}
button { user-select: none; -webkit-tap-highlight-color: transparent; }

header {
  padding: 1.25rem 1.5rem 0.9rem;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--panel) 55%, transparent);
}
header h1 {
  margin: 0 0 0.25rem;
  font-size: clamp(1.15rem, 2.2vw, 1.45rem);
  font-weight: 700; letter-spacing: -0.02em;
}
header p { margin: 0; color: var(--muted); font-size: 0.88rem; max-width: 56rem; }

.wrap {
  max-width: var(--shell-w); margin: 0 auto;
  padding: 0.85rem var(--shell-pad) 2.5rem;
  display: grid;
  grid-template-columns: minmax(180px, 220px) minmax(0, 1fr);
  gap: 0.75rem; align-items: start;
}
.main-col { min-width: 0; }
.side-panel {
  position: sticky; top: 0.75rem;
  max-height: calc(100vh - 1.5rem); overflow: auto;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 0.65rem;
  scrollbar-width: thin; scrollbar-color: #3a4a60 transparent;
}
.side-panel .label {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--muted); font-weight: 700; margin: 0 0 0.45rem;
}
.side-panel input {
  width: 100%; margin-bottom: 0.5rem;
  border: 1px solid var(--border); background: var(--panel2);
  color: var(--text); border-radius: 7px; padding: 0.4rem 0.5rem; font-size: 0.8rem;
}
.side-panel .list { display: flex; flex-direction: column; gap: 0.28rem; }
.side-panel button {
  text-align: left; border: 1px solid var(--border); background: var(--panel2);
  color: var(--text); border-radius: 7px; padding: 0.38rem 0.45rem;
  cursor: pointer; font-size: 0.76rem; display: flex; align-items: center; gap: 0.4rem;
}
.side-panel button .name { flex: 1; }
.side-panel button .count { color: var(--muted); font-size: 0.68rem; font-variant-numeric: tabular-nums; }
.side-panel button:hover { border-color: #4a5d75; }
.side-panel button.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent);
}

.filter-row { margin-bottom: 0.75rem; }
.filter-row .label {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--muted); font-weight: 700; margin: 0 0 0.4rem;
}
.exp-nav {
  display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0.4rem;
}
.exp-nav button {
  text-align: left; border: 1px solid var(--border); background: var(--panel);
  color: var(--text); border-radius: 8px; padding: 0.42rem 0.55rem;
  cursor: pointer; font-size: 0.78rem; line-height: 1.25; min-height: 2.5rem;
}
.exp-nav button .xp { display: block; color: var(--muted); font-size: 0.68rem; margin-top: 0.12rem; }
.exp-nav button:hover { border-color: #4a5d75; }
.exp-nav button.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent);
  background: color-mix(in srgb, var(--accent) 10%, var(--panel));
}

.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden;
}
.card h2 {
  margin: 0; padding: 0.8rem 1rem; font-size: 1.05rem;
  background: var(--panel2); border-bottom: 1px solid var(--border);
}
.card h2 .meta {
  display: block; font-size: 0.74rem; font-weight: 500;
  color: var(--muted); margin-top: 0.2rem;
}
.table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 1100px; }
th, td { padding: 0.42rem 0.55rem; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
th {
  color: var(--muted); font-size: 0.65rem; text-transform: uppercase;
  letter-spacing: 0.04em; background: rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 1;
}
tr:nth-child(even) td { background: rgba(0,0,0,0.1); }
tr.selected td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
tr:last-child td { border-bottom: none; }
.exp { width: 3.6rem; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 650; }
.num { font-variant-numeric: tabular-nums; color: #c5d8ea; }
.digimon { font-weight: 650; white-space: nowrap; }
.loc { color: #c5d8ea; font-size: 0.78rem; max-width: 14rem; }
.item { color: #c5d8ea; font-size: 0.78rem; white-space: nowrap; }
.species { color: var(--muted); font-size: 0.75rem; }

.el {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.22rem;
  min-height: 1.3rem; padding: 0.1rem 0.35rem;
  border-radius: 6px; font-size: 0.65rem; font-weight: 700;
  border: 1px solid transparent; line-height: 1.1; white-space: nowrap;
}
.el .el-val { font-variant-numeric: tabular-nums; font-weight: 650; opacity: 0.9; }
.el.fire { background: color-mix(in srgb, var(--fire) 22%, var(--panel2)); border-color: var(--fire); color: #ffab91; }
.el.water { background: color-mix(in srgb, var(--water) 22%, var(--panel2)); border-color: var(--water); color: #90caf9; }
.el.ice { background: color-mix(in srgb, var(--ice) 22%, var(--panel2)); border-color: var(--ice); color: #b2ebf2; }
.el.wind { background: color-mix(in srgb, var(--wind) 22%, var(--panel2)); border-color: var(--wind); color: #c5e1a5; }
.el.thunder { background: color-mix(in srgb, var(--thunder) 22%, var(--panel2)); border-color: var(--thunder); color: #ffe082; }
.el.machine { background: color-mix(in srgb, var(--machine) 22%, var(--panel2)); border-color: var(--machine); color: #cfd8dc; }
.el.dark { background: color-mix(in srgb, var(--dark) 22%, var(--panel2)); border-color: var(--dark); color: #e1bee7; }
.res-cell { display: flex; flex-wrap: wrap; gap: 0.25rem; min-width: 22rem; }
.stat-cell {
  display: grid;
  grid-template-columns: repeat(2, minmax(4.4rem, max-content));
  column-gap: 0.55rem;
  row-gap: 0.12rem;
  min-width: 9.4rem;
}
.stat-cell.status {
  grid-template-columns: repeat(2, minmax(5.2rem, max-content));
  min-width: 11rem;
}
.stat-pill {
  display: grid;
  grid-template-columns: 2rem minmax(2rem, auto);
  gap: 0.2rem;
  align-items: baseline;
  font-size: 0.72rem; color: var(--muted); white-space: nowrap;
}
.stat-cell.status .stat-pill {
  grid-template-columns: 3.6rem minmax(1.6rem, auto);
}
.stat-pill b {
  color: var(--text); font-variant-numeric: tabular-nums; font-weight: 700;
  text-align: right;
}
.note { color: var(--muted); font-size: 0.8rem; margin-top: 0.85rem; }
.empty { padding: 1.25rem 1rem; color: var(--muted); }

@media (max-width: 1100px) {
  .wrap { grid-template-columns: 1fr; }
  .side-panel { position: static; max-height: 240px; }
  .exp-nav { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 700px) {
  .wrap { padding: 0.75rem; }
  .exp-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>

<script>
const DATA = window.DW3_MONSTERS;
const ELEMENTS = DATA.elements;
const MAIN = DATA.mainStats;
const STATUS = DATA.statusStats;
const EL_CLASS = {
  Fire: "fire", Water: "water", Ice: "ice", Wind: "wind",
  Thunder: "thunder", Machine: "machine", Dark: "dark"
};
const LEVEL_RANGES = [
  { id: "all", min: 0, max: 99999, label: "All levels" },
  { id: "r1", min: 1, max: 10, label: "Lv 1 – 10" },
  { id: "r2", min: 11, max: 20, label: "Lv 11 – 20" },
  { id: "r3", min: 21, max: 30, label: "Lv 21 – 30" },
  { id: "r4", min: 31, max: 40, label: "Lv 31 – 40" },
  { id: "r5", min: 41, max: 50, label: "Lv 41 – 50" },
  { id: "r6", min: 51, max: 99999, label: "Lv 51+" }
];

let currentRangeId = "all";
let selectedId = null;
let filter = "";

function currentRange() {
  return LEVEL_RANGES.find(r => r.id === currentRangeId) || LEVEL_RANGES[0];
}

function inRange(m, range) {
  if (m.level == null) return range.id === "all";
  return m.level >= range.min && m.level <= range.max;
}

function filtered() {
  const range = currentRange();
  const q = filter.trim().toLowerCase();
  return DATA.monsters
    .filter(m => inRange(m, range))
    .filter(m => !q || m.name.toLowerCase().includes(q) || m.id.toLowerCase().includes(q) || (m.locationRaw || "").toLowerCase().includes(q))
    .sort((a, b) => {
      const ag = /galacticmon/i.test(a.name) ? 1 : 0;
      const bg = /galacticmon/i.test(b.name) ? 1 : 0;
      if (ag !== bg) return ag - bg;
      const al = a.level == null ? 99999 : a.level;
      const bl = b.level == null ? 99999 : b.level;
      if (al !== bl) return al - bl;
      const ae = a.exp == null ? 99999 : a.exp;
      const be = b.exp == null ? 99999 : b.exp;
      return ae - be || a.name.localeCompare(b.name);
    });
}

function elBadge(name, value) {
  const cls = EL_CLASS[name] || "";
  const val = value == null ? "" : ` <span class="el-val">${value}</span>`;
  return `<span class="el ${cls}">${name}${val}</span>`;
}

function resCell(m) {
  const rows = ELEMENTS
    .map(el => ({ el, v: m.res[el] }))
    .filter(r => r.v != null)
    .sort((a, b) => a.v - b.v || a.el.localeCompare(b.el));
  return `<div class="res-cell">${rows.map(r => elBadge(r.el, r.v)).join("")}</div>`;
}

function mainCell(m) {
  return `<div class="stat-cell">${MAIN.map(s => {
    const v = m.stats[s];
    return `<span class="stat-pill"><span>${s.slice(0, 3)}</span><b>${v == null ? "—" : v}</b></span>`;
  }).join("")}</div>`;
}

function statusCell(m) {
  return `<div class="stat-cell status">${STATUS.map(s => {
    const v = m.status[s];
    return `<span class="stat-pill"><span>${s}</span><b>${v == null || v === "" ? "—" : v}</b></span>`;
  }).join("")}</div>`;
}

function selectRange(id) {
  currentRangeId = id;
  selectedId = null;
  render();
}

function selectMonster(id) {
  selectedId = id;
  render();
  const row = document.querySelector(`tr[data-id="${CSS.escape(id)}"]`);
  if (row) row.scrollIntoView({ behavior: "smooth", block: "center" });
}

function renderLevelNav() {
  const nav = document.getElementById("levelNav");
  nav.innerHTML = LEVEL_RANGES.map(r => {
    const n = DATA.monsters.filter(m => inRange(m, r)).length;
    return `<button type="button" data-range="${r.id}" class="${currentRangeId === r.id ? "active" : ""}">
      ${r.label}<span class="xp">${n} Digimon</span>
    </button>`;
  }).join("");
  nav.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => selectRange(btn.dataset.range));
  });
}

function renderList() {
  const list = document.getElementById("list");
  const rows = filtered();
  list.innerHTML = rows.map(m => `
    <button type="button" data-id="${m.id}" class="${selectedId === m.id ? "active" : ""}">
      <span class="name">${m.name}</span>
      <span class="count">Lv ${m.level == null ? "—" : m.level}</span>
    </button>
  `).join("") || `<div class="empty">Sem resultados</div>`;
  list.querySelectorAll("button[data-id]").forEach(btn => {
    btn.addEventListener("click", () => selectMonster(btn.dataset.id));
  });
}

function renderTable() {
  const rows = filtered();
  const range = currentRange();
  const el = document.getElementById("content");
  if (!rows.length) {
    el.innerHTML = `<article class="card"><h2>Monsters<span class="meta">${range.label}</span></h2><div class="empty">Nenhum Digimon neste filtro.</div></article>`;
    return;
  }
  el.innerHTML = `<article class="card">
    <h2>Monsters by level<span class="meta">${rows.length} Digimon · ${range.label} · menor nível primeiro</span></h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Lv</th>
            <th>EXP</th>
            <th>BIT</th>
            <th>Digimon</th>
            <th>HP</th>
            <th>MP</th>
            <th>Species</th>
            <th>Combat</th>
            <th>Resistances</th>
            <th>Status resist</th>
            <th>Drop</th>
            <th>Location</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(m => `
            <tr data-id="${m.id}" class="${selectedId === m.id ? "selected" : ""}">
              <td class="exp">${m.level == null ? "—" : m.level}</td>
              <td class="num">${m.exp == null ? "—" : m.exp}</td>
              <td class="num">${m.bits == null ? "—" : m.bits}</td>
              <td class="digimon">${m.name}${m.variant ? ' <span class="species">variant</span>' : ""}</td>
              <td class="num">${m.hp == null ? "—" : m.hp}</td>
              <td class="num">${m.mp == null ? "—" : m.mp}</td>
              <td class="species">${m.species || "—"}</td>
              <td>${mainCell(m)}</td>
              <td>${resCell(m)}</td>
              <td>${statusCell(m)}</td>
              <td class="item">${m.item || "—"}${m.dropRate ? ` <span class="species">(${m.dropRate})</span>` : ""}</td>
              <td class="loc">${m.locationRaw || "—"}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  </article>`;
}

function render() {
  renderLevelNav();
  renderList();
  renderTable();
}

document.getElementById("search").addEventListener("input", e => {
  filter = e.target.value;
  renderList();
  renderTable();
});

render();
</script>

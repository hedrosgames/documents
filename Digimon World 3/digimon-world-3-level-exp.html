<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="dw3-shell.css">
<title>Digimon World 3 — Level EXP</title>
<style>
:root {
  --bg: #0c1017;
  --panel: #151c27;
  --panel2: #1c2635;
  --text: #edf2f7;
  --muted: #8fa0b5;
  --border: #2a3648;
  --accent: #3ecf8e;
  --asuka: #4db6ff;
  --amaterasu: #f0a020;
  --special: #b388ff;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  -webkit-font-smoothing: antialiased;
  font-family: "Segoe UI", system-ui, sans-serif;
  background:
    radial-gradient(ellipse 70% 40% at 0% 0%, rgba(77,182,255,0.1), transparent),
    radial-gradient(ellipse 50% 35% at 100% 0%, rgba(240,160,32,0.08), transparent),
    var(--bg);
  color: var(--text); line-height: 1.45;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--accent) 70%, white);
  outline-offset: 2px;
}
button { user-select: none; -webkit-tap-highlight-color: transparent; }

header {
  padding: 1.25rem 1.5rem 0.9rem;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--panel) 55%, transparent);
}
header h1 {
  margin: 0 0 0.25rem;
  font-size: clamp(1.15rem, 2.2vw, 1.45rem);
  font-weight: 700; letter-spacing: -0.02em;
}
header p { margin: 0; color: var(--muted); font-size: 0.88rem; max-width: 56rem; }

.wrap {
  max-width: 1440px; margin: 0 auto;
  padding: 0.85rem 1.25rem 2.5rem;
  display: grid;
  grid-template-columns: minmax(170px, 210px) minmax(0, 1fr);
  gap: 0.75rem; align-items: start;
}
.main-col { min-width: 0; }
.side-panel {
  position: sticky; top: 0.75rem;
  max-height: calc(100vh - 1.5rem); overflow: auto;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 0.65rem;
  scrollbar-width: thin; scrollbar-color: #3a4a60 transparent;
}
.side-panel .label {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--muted); font-weight: 700; margin: 0 0 0.45rem;
}
.side-panel .list { display: flex; flex-direction: column; gap: 0.28rem; }
.side-panel button {
  text-align: left; border: 1px solid var(--border); background: var(--panel2);
  color: var(--text); border-radius: 7px; padding: 0.38rem 0.45rem;
  cursor: pointer; font-size: 0.76rem; display: flex; align-items: center; gap: 0.4rem;
}
.side-panel button .name { flex: 1; }
.side-panel button .count { color: var(--muted); font-size: 0.68rem; font-variant-numeric: tabular-nums; }
.side-panel button:hover { border-color: #4a5d75; }
.side-panel button.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent);
}

.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden; margin-bottom: 0.75rem;
}
.card h2 {
  margin: 0; padding: 0.8rem 1rem; font-size: 1.05rem;
  background: var(--panel2); border-bottom: 1px solid var(--border);
}
.card h2 .meta {
  display: block; font-size: 0.74rem; font-weight: 500;
  color: var(--muted); margin-top: 0.2rem;
}
.milestones {
  display: flex; flex-wrap: wrap; gap: 0.35rem;
  padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border);
}
.ms {
  border: 1px solid var(--border); background: var(--panel2);
  border-radius: 6px; padding: 0.25rem 0.45rem; font-size: 0.72rem;
  display: flex; align-items: baseline; gap: 0.35rem;
}
.ms b { font-variant-numeric: tabular-nums; color: var(--accent); }
.ms span { color: var(--muted); font-size: 0.66rem; }

.level-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0;
  padding: 0.35rem;
}
.level-grid table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.74rem;
  table-layout: fixed;
}
.level-grid th, .level-grid td {
  padding: 0.18rem 0.35rem;
  text-align: right;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.level-grid th:first-child,
.level-grid td:first-child { text-align: left; width: 2.2rem; }
.level-grid th {
  color: var(--muted); font-size: 0.6rem; text-transform: uppercase;
  letter-spacing: 0.03em; background: rgba(0,0,0,0.2);
  position: sticky; top: 0; z-index: 1;
}
.level-grid tr:nth-child(even) td { background: rgba(0,0,0,0.08); }
.level-grid tr.mark td { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.level-grid .lv { font-weight: 700; color: var(--text); }
.level-grid .num { font-variant-numeric: tabular-nums; color: #c5d8ea; }
.level-grid .col + .col { border-left: 1px solid var(--border); padding-left: 0.2rem; }

.note { color: var(--muted); font-size: 0.8rem; margin-top: 0.85rem; }
.rank {
  display: flex; flex-wrap: wrap; gap: 0.3rem;
  padding: 0.5rem 0.75rem 0.65rem;
}
.rank-item {
  border: 1px solid var(--border); background: var(--panel2);
  border-radius: 6px; padding: 0.28rem 0.45rem; font-size: 0.72rem;
  display: flex; align-items: baseline; gap: 0.35rem;
}
.rank-item .n { color: var(--muted); font-size: 0.64rem; }
.rank-item b { font-variant-numeric: tabular-nums; color: var(--accent); }

@media (max-width: 1100px) {
  .wrap { grid-template-columns: 1fr; }
  .side-panel { position: static; max-height: 220px; }
  .level-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 700px) {
  .level-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<script>
(function () {
  const DATA = window.DW3_LEVEL_EXP;
  let partnerId = DATA.partnerOrder[0];

  const fmt = (n) => (n == null ? "—" : n.toLocaleString("en-US"));

  function renderSide() {
    const list = document.getElementById("list");
    list.innerHTML = DATA.partners.map((p) => `
      <button type="button" data-id="${p.id}" class="${p.id === partnerId ? "active" : ""}">
        <span class="name">${p.name}</span>
        <span class="count">${fmt(p.to99)}</span>
      </button>
    `).join("");
    list.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        partnerId = btn.dataset.id;
        renderSide();
        render();
      });
    });
  }

  function marksForPartner() {
    return new Set(DATA.unlockHints.map((h) => h.level));
  }

  function levelChunkTable(rows, marks) {
    return `
      <div class="col">
        <table>
          <thead><tr><th>Lv</th><th>Total</th><th>Next</th></tr></thead>
          <tbody>
            ${rows.map((row) => `
              <tr class="${marks.has(row.level) ? "mark" : ""}">
                <td class="lv">${row.level}</td>
                <td class="num">${fmt(row.total)}</td>
                <td class="num">${row.level === 99 ? "—" : fmt(row.toNext)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>`;
  }

  function render() {
    const p = DATA.partners.find((x) => x.id === partnerId);
    const marks = marksForPartner();
    const rankPos = DATA.ranking.findIndex((r) => r.name === p.name) + 1;
    const chunks = [
      p.levels.slice(0, 33),
      p.levels.slice(33, 66),
      p.levels.slice(66),
    ];
    const content = document.getElementById("content");
    content.innerHTML = `
      <div class="card">
        <h2>${p.name}
          <span class="meta">EXP até 99: ${fmt(p.to99)} · velocidade #${rankPos}/${DATA.ranking.length}</span>
        </h2>
        <div class="milestones">
          ${DATA.unlockHints.map((h) => `
            <div class="ms"><span>Lv ${h.level}</span><b>${fmt(p.milestones[String(h.level)])}</b></div>
          `).join("")}
          <div class="ms"><span>Lv 99</span><b>${fmt(p.milestones["99"])}</b></div>
        </div>
        <div class="level-grid">
          ${chunks.map((c) => levelChunkTable(c, marks)).join("")}
        </div>
      </div>
      <div class="card">
        <h2>Speed rank <span class="meta">Menos EXP até 99 = sobe mais rápido</span></h2>
        <div class="rank">
          ${DATA.ranking.map((r, i) => `
            <div class="rank-item">
              <span class="n">#${i + 1}</span>
              <span>${r.name}</span>
              <b>${fmt(r.to99)}</b>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  renderSide();
  render();
})();
</script>
